<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CA Exam Prep</title>
  </head>
  <body class="min-h-screen bg-blush font-sans text-ink antialiased">
    <div class="mx-auto flex min-h-screen w-full max-w-2xl flex-col px-4 py-4 sm:px-6 sm:py-6">
      <header class="shrink-0">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <span aria-hidden="true" class="text-xl leading-none">🎀</span>
            <h1 class="text-sm font-black uppercase tracking-[0.16em]">CA Exam Prep</h1>
          </div>
          <span id="tierBadge" class="nb-badge" data-tier="easy">Easy</span>
        </div>

        <div class="mt-4 flex items-end justify-between gap-4">
          <div class="flex items-end gap-4">
            <div>
              <p id="dotsLabel" class="text-[10px] font-black uppercase tracking-[0.18em] text-ink/60">Easy streak</p>
              <div id="dots" class="mt-1.5 flex items-center gap-1.5"></div>
            </div>
            <div>
              <p class="text-[10px] font-black uppercase tracking-[0.18em] text-ink/60">Hard charge</p>
              <div id="hardDots" class="mt-1.5 flex items-center gap-1.5"></div>
            </div>
          </div>
          <div class="text-right">
            <p class="text-[10px] font-black uppercase tracking-[0.18em] text-ink/60">Correct</p>
            <p class="text-sm font-black tabular-nums"><span id="score">0</span></p>
          </div>
        </div>
      </header>

      <main class="flex flex-1 items-center py-5">
        <section class="nb w-full bg-white p-5 sm:p-6">
          <div class="flex items-center justify-between gap-2">
            <span id="questionLabel" class="text-[10px] font-black uppercase tracking-[0.18em]">Question</span>
            <span id="questionTier" class="text-[10px] font-black uppercase tracking-[0.18em] text-hot">Easy</span>
          </div>

          <h2 id="questionText" class="mt-3 text-lg font-black leading-snug sm:text-xl">&nbsp;</h2>

          <div id="options" class="mt-5 grid gap-2.5"></div>

          <p id="feedback" class="mt-3 min-h-5 text-[11px] font-black uppercase tracking-[0.12em] text-ink/60"></p>
        </section>
      </main>

      <footer class="flex shrink-0 items-center justify-between gap-3 pb-1">
        <span class="text-[10px] font-bold uppercase tracking-[0.14em] text-ink/50">Press 1–4</span>
        <button id="skip" type="button" class="nb-skip">Skip question →</button>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
